name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: jq empty .claude-plugin/plugin.json

      - name: Check agent frontmatter
        run: |
          fail=0
          for f in agents/*.md; do
            for field in "^name:" "^description:" "^tools:"; do
              if ! awk '/^---/{c++} c==1' "$f" | grep -q "$field"; then
                echo "FAIL $f missing field: $field"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Check command frontmatter
        run: |
          shopt -s nullglob
          fail=0
          for f in commands/*.md; do
            for field in "^description:" "^allowed-tools:"; do
              if ! awk '/^---/{c++} c==1' "$f" | grep -q "$field"; then
                echo "FAIL $f missing field: $field"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Check tool names exist in TOOLSET.md
        run: |
          shopt -s nullglob
          fail=0
          for f in agents/*.md commands/*.md; do
            # Extract tool names from frontmatter (strip mcp__ prefix namespace, get the mcp_ado_* name)
            tools=$(awk '/^---/{c++} c==1' "$f" | grep -o 'mcp_ado_[a-z_]*' || true)
            for tool in $tools; do
              if ! grep -q "### $tool" docs/TOOLSET.md; then
                echo "FAIL $f references unknown tool: $tool"
                fail=1
              fi
            done
          done
          exit $fail
